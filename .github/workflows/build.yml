name: Advanced Master AI APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies & Compilers
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-pip \
          python3-dev \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          ant \
          patch \
          libstdc++6 \
          libglu1-mesa-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Install Python Build Tools (Cython & Buildozer)
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer

    - name: Build Android APK with Auto-License Acceptance
      run: |
        yes | buildozer -v android debug

    - name: Verify APK Generation
      run: |
        ls -la bin/
        find bin/ -name "*.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: master-ai-apk
        path: bin/*.apk
